name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      prev_sha: ${{ steps.info.outputs.prev_sha }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Checks
        run: |
          npm run lint
          npm run test

      - name: Capture Previous Commit and Package Version
        id: info
        run: |
          PREV_SHA="${{ github.event.before }}"
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "None")
          fi
          echo "prev_sha=$PREV_SHA" >> $GITHUB_OUTPUT
          
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Deployment Tracking Issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${context.sha}`,
              labels: ['deployment', 'in-progress'],
              body: `### Deployment Tracking Initialized

Commit SHA: \`${context.sha}\`

Automated quality checks passed successfully.`
            });
            core.setOutput('issue_number', issue.data.number);

      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create_issue.outputs.issue_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Pre-deployment checks completed'
            });

  rollback-preparation:
    name: rollback-preparation
    needs: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.comment_body.outputs.checksum }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create Rollback Directory
        run: mkdir -p rollback-package/backup

      - name: Create Rollback Script
        run: |
          cat << 'EOF' > rollback-package/rollback.sh
          #!/bin/bash
          set -euo pipefail
          echo "=== Initiating Rollback Process ==="
          
          error_handler() {
            echo "[-] Error occurred at line $1. Rollback failed!" >&2
            exit 1
          }
          trap 'error_handler $LINENO' ERR

          PREV_SHA="${{ needs.pre-deployment.outputs.prev_sha }}"
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "None" ]; then
            echo "[-] No previous SHA available to rollback to!" >&2
            exit 1
          fi

          echo "[+] Rolling back to previous commit: $PREV_SHA"
          echo "[+] Verifying configuration backup..."
          if [ ! -f "backup/package.json" ]; then
            echo "[-] Backup of package.json is missing!" >&2
            exit 1
          fi

          echo "[+] Restoring backup configuration..."
          cp backup/package.json ./package.json
          if [ -f "backup/package-lock.json" ]; then
            cp backup/package-lock.json ./package-lock.json
          fi

          echo "[+] Running dependency verification..."
          node verify_dependencies.js

          echo "[+] Rollback completed successfully!"
          EOF
          chmod +x rollback-package/rollback.sh

      - name: Create Configuration Backups
        run: |
          cp package.json rollback-package/backup/
          if [ -f package-lock.json ]; then
            cp package-lock.json rollback-package/backup/
          fi
          # Create environment template
          cat << 'EOF' > rollback-package/backup/.env.template
          PORT=3000
          NODE_ENV=production
          DATABASE_URL=mongodb://localhost:27017/prod
          EOF

      - name: Create Dependency Verification Script
        run: |
          cat << 'EOF' > rollback-package/verify_dependencies.js
          const fs = require('fs');
          try {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            console.log('Verifying dependencies for package:', pkg.name);
            if (!pkg.dependencies || Object.keys(pkg.dependencies).length === 0) {
              console.warn('Warning: No dependencies found!');
            } else {
              console.log('Dependencies are valid:');
              console.log(JSON.stringify(pkg.dependencies, null, 2));
            }
            console.log('Dependency verification completed successfully: true');
          } catch (err) {
            console.error('Dependency verification failed:', err.message);
            process.exit(1);
          }
          EOF

      - name: Create Rollback Documentation
        run: |
          cat << 'EOF' > rollback-package/ROLLBACK.md
          # Rollback Documentation

          This document outlines the step-by-step instructions for rolling back the deployment.

          ## Steps to Rollback:
          1. Stop the current running application instance.
          2. Extract the rollback package if not already done: `tar -xzf rollback-package.tar.gz`.
          3. Change into the rollback package directory: `cd rollback-package`.
          4. Execute the rollback script: `./rollback.sh`.
          5. Verify that the configuration files (`package.json`, `package-lock.json`) have been successfully restored.
          6. Perform application health checks.
          EOF

      - name: Validate Scripts
        run: |
          # Verify files exist
          [ -f rollback-package/rollback.sh ] && echo "Rollback script created: true" || exit 1
          [ -f rollback-package/backup/package.json ] && echo "Configuration backup: true" || exit 1
          [ -f rollback-package/verify_dependencies.js ] || exit 1
          [ -f rollback-package/ROLLBACK.md ] || exit 1
          
          # Test run dependency verification script
          node rollback-package/verify_dependencies.js

      - name: Generate Checksums and Compress Package
        run: |
          cd rollback-package
          find . -type f -not -name "checksums.sha256" -exec sha256sum {} + > checksums.sha256
          cd ..
          tar -czf rollback-package.tar.gz rollback-package/

      - name: Upload Rollback Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ github.sha }}
          path: rollback-package.tar.gz
          retention-days: 30

      - name: Generate Rollback Comment Body
        id: comment_body
        run: |
          CHECKSUM=$(sha256sum rollback-package.tar.gz | cut -d ' ' -f 1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          
          cat << EOF > comment.md
          ## 🔄 Rollback Plan Ready

          - Previous Commit: ${{ needs.pre-deployment.outputs.prev_sha }}
          - Current Commit: ${{ github.sha }}
          - Package Version: ${{ needs.pre-deployment.outputs.version }}
          - Artifact: rollback-package-${{ github.sha }}

          ### Completed Components:
          - [x] ✅ Executable rollback script with proper error handling
          - [x] ✅ Configuration backups (package.json, package-lock.json, environment templates)
          - [x] ✅ Dependency verification script for compatibility checking
          - [x] ✅ Detailed rollback documentation with step-by-step instructions
          - [x] ✅ Compressed rollback package with SHA256 checksums

          ### Quick Rollback Command:
          \`\`\`bash
          # Extract and execute rollback package
          tar -xzf rollback-package.tar.gz
          cd rollback-package
          chmod +x rollback.sh
          ./rollback.sh
          \`\`\`

          - Rollback script created: true
          - Configuration backup: true
          - SHA256: $CHECKSUM
          EOF

      - name: Post Rollback Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

  post-deployment:
    name: post-deployment
    needs: [pre-deployment, rollback-preparation]
    runs-on: ubuntu-latest
    steps:
      - name: Complete Deployment and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // 1. Remove 'in-progress' label
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              console.log("Successfully removed label 'in-progress'");
            } catch (err) {
              console.log("Could not remove 'in-progress' label:", err.message);
            }
            
            // 2. Add 'completed' label
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            console.log("Successfully added label 'completed'");
            
            // 3. Post final comment
            const commentBody = `### Deployment Completed Successfully

` +
              `The deployment completed successfully!

` +
              `**Rollback Artifact Details:**
` +
              `- Artifact Name: rollback-package-\`${context.sha}\`
` +
              `- SHA256 Checksum: \`${{ needs.rollback-preparation.outputs.checksum }}\``;
              
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: commentBody
            });
            console.log("Successfully posted final comment");
            
            // 4. Close the deployment tracking issue
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            console.log("Successfully closed deployment tracking issue");
